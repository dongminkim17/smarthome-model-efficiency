# Optional AVT teacher SFT. Single GPU gives effective batch size four.
task: mer6
model: models/Qwen2.5-Omni-3B
data_root: data_mer_avt_chinese
cache_dir: artifacts/pilot_cache_mer_avt_chinese
seed: 42
split_seed: 42
epochs: 5
deterministic: true
gradient_checkpointing: true
learning_rate: 0.0001
warmup_ratio: 0.03
scheduler: cosine
weight_decay: 0.0
max_grad_norm: 1.0
gradient_accumulation_steps: 2
micro_batch_size: 2
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target: qv
max_frames: 8
max_pixels: 50176
use_transcript: true
eval_modes:
- logit
- greedy
selection_mode: logit
eval_every_fraction: 0.5
max_new_tokens: 8
train_limit: null
dev_limit: null
num_threads: 2
objective: sft
teacher_checkpoint: null
teacher_cache: null
distillation_alpha: 0.5
distillation_temperature: 2.0
