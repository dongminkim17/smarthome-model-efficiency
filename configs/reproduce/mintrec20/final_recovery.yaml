# Single GPU. Microbatch two with accumulation two gives effective batch size four.
feature_teacher_cache: artifacts/reproduce/mintrec20/teacher_targets/features
feature_audio_weight: 0.1
feature_vision_weight: 0.1
task: mintrec20
model: artifacts/reproduce/mintrec20/recovered_lm
data_root: data
cache_dir: artifacts/pilot_cache
seed: 42
split_seed: 42
epochs: 5
deterministic: true
gradient_checkpointing: true
learning_rate: 0.0001
warmup_ratio: 0.03
scheduler: cosine
weight_decay: 0.0
max_grad_norm: 1.0
gradient_accumulation_steps: 2
micro_batch_size: 2
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.0
lora_target: decoder_encoder_linear
max_frames: 8
max_pixels: 50176
use_transcript: true
eval_modes:
- logit
selection_mode: logit
eval_every_fraction: 0.5
max_new_tokens: 8
train_limit: null
dev_limit: null
num_threads: 2
objective: sft_kd
teacher_checkpoint: artifacts/reproduce/mintrec20/teacher/checkpoints/best
teacher_cache: artifacts/reproduce/mintrec20/teacher_targets/classes/cache.json
distillation_alpha: 0.75
distillation_temperature: 2.0
encoder_learning_rate: 1.0e-05
